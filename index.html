/* v1.5.0: landscape (tablet landscape, PC/laptop). Logical height 820px scaled to the screen, width fills the
   screen; the battlefield on the left, header and command panel on the right. Menus open as centered windows. */
html.layout-landscape,html.layout-landscape body{height:100%;overflow:hidden}
html.layout-landscape #app{position:fixed;top:0;left:50%;width:var(--land-w,1400px);max-width:none;height:820px;min-height:0;margin:0;transform:translateX(-50%) scale(var(--game-scale,1));transform-origin:50% 0;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"view head" "view panel"}
html.layout-landscape header{grid-area:head}
html.layout-landscape .viewport{grid-area:view;min-height:0}
html.layout-landscape .panel{grid-area:panel;overflow-y:auto;border-top:0;border-left:3px solid #c5ac72;padding:16px 18px 18px}
html.layout-landscape .overlay{justify-content:center;align-items:center}
html.layout-landscape .sheet{width:min(720px,92%);max-height:90%;border-radius:20px}
html.layout-landscape .sheet.world-sheet{height:90%;max-height:90%}
html.layout-landscape #toast{left:calc((100% - 400px)/2)}
html.layout-landscape .title-bottom{max-width:360px;margin-left:auto;margin-right:auto}
/* v1.5.1: landscape screens. */
/* v1.5.2: landscape command panel: skill shortcuts, enemy status, footer line; party chips with HP bars. */
.side-panel,.chip-hp{display:none}
html.layout-landscape .side-panel{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.side-panel h4{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;font-size:14px;font-weight:400;color:#7e7658}
.side-panel h4 small{font-size:11px;color:#8a937f}
.sp-skills{display:grid;gap:4px}.sp-skills h4{grid-column:1/-1}
.sp-skill{display:flex;align-items:center;gap:6px;width:100%;padding:6px 9px;border:1px solid #c5ccbb;border-radius:6px;background:#e7e9dd;color:#2f4a40;font-size:13px;text-align:left}
.sp-skill span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sp-skill em{font-style:normal;font-size:12px}.sp-skill b{font-weight:400;font-size:11px;color:#5c7a6c}
.sp-skill.on{background:#235b4d;color:#f4f0dc;border-color:#235b4d}.sp-skill.on b{color:#d6e9d9}
.sp-skill .skill-key{margin-right:0}
.sp-enemies{display:grid;gap:4px}
.sp-enemy{display:grid;grid-template-columns:1fr 92px;grid-template-rows:auto auto;column-gap:8px;align-items:center;width:100%;padding:6px 9px;border:1px solid #d6cdb8;border-radius:6px;background:#efe6d6;color:#4a3b31;text-align:left}
.sp-enemy .sp-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-enemy small{grid-column:1/-1;font-family:var(--font-body);font-size:11px;color:#7a6a5a}
.sp-bar{display:block;height:5px;border-radius:3px;background:#d8c9b6;overflow:hidden}.sp-bar i{display:block;height:100%;background:#d0715f}.sp-bar.low i{background:#b8432f}
.sp-danger{padding:6px 9px;border-radius:6px;background:#f3d6cf;color:#8c3a2e;font-size:12px;border:1px solid #d99a8c}
.sp-more{font-size:11px;color:#8a937f;text-align:right}
.sp-foot{padding:7px 10px;border-radius:6px;background:#e3e6d9;color:#506a5e;font-size:12px;font-family:var(--font-body)}
.sp-foot.sp-hover{background:#d8e5d7;color:#2f4a40}
html.layout-landscape .chip-hp{display:block;position:absolute;left:5px;right:5px;bottom:3px;height:3px;border-radius:2px;background:#cfd5c7;overflow:hidden}
html.layout-landscape .chip-hp i{display:block;height:100%;background:#38836c}html.layout-landscape .chip-hp.low i{background:#c0563f}
/* v1.5.3: in landscape, tab rows (chapters, heroes, filters) wrap onto a second line instead of hiding off the edge. */
html.layout-landscape .chaptertabs{flex-wrap:wrap;overflow-x:visible}
/* World map: 3D chapter map on the left, progress, chapters and actions on the right. */
html.layout-landscape .sheet.world-sheet{width:min(1240px,95%);display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:repeat(7,min-content) 1fr;column-gap:20px;align-content:stretch}
html.layout-landscape .world-sheet>*{grid-column:2}
html.layout-landscape .world-sheet>.journey-map{grid-column:1;grid-row:1/-1;height:auto;min-height:0}
html.layout-landscape .world-sheet .map-actions{flex-wrap:wrap}
html.layout-landscape .world-sheet .map-actions button{flex:1 1 30%}
/* Inventory / shop / party: two columns, each scrolling on its own. */
html.layout-landscape .sheet.sheet-split{width:min(1180px,95%);height:90%;display:flex;flex-direction:column;overflow:hidden}
.sheet-columns{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.sheet-col{overflow-y:auto;min-height:0;padding-right:6px;overscroll-behavior:contain}
.sheet-col>:first-child{margin-top:0}
/* Encyclopedia: wider window, lists in two columns. */
html.layout-landscape .sheet[data-title="백과사전"]{width:min(1100px,95%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:12px;align-content:start}
html.layout-landscape .sheet[data-title="백과사전"]>*{grid-column:1/-1}
html.layout-landscape .sheet[data-title="백과사전"]>.choice,html.layout-landscape .sheet[data-title="백과사전"]>details{grid-column:auto;align-self:start}
/* Encyclopedia detail (hero / monster / boss): 3D model on the left, details on the right. */
html.layout-landscape .sheet:has(>#codexModel){width:min(1000px,95%);display:grid;grid-template-columns:380px minmax(0,1fr);column-gap:22px;align-content:start}
html.layout-landscape .sheet:has(>#codexModel)>*{grid-column:2}
html.layout-landscape .sheet:has(>#codexModel)>.sheethead{grid-column:1/-1}
html.layout-landscape .sheet:has(>#codexModel)>#codexModel{grid-column:1;grid-row:2/span 60;height:380px;position:sticky;top:0;align-self:start}
/* Story dialogue: scene on the left, dialogue and buttons on the right. */
html.layout-landscape .sheet:has(>.story-scene){width:min(1100px,95%);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);column-gap:22px;align-content:start}
html.layout-landscape .sheet:has(>.story-scene)>*{grid-column:2}
html.layout-landscape .sheet:has(>.story-scene)>.sheethead{grid-column:1/-1}
html.layout-landscape .sheet:has(>.story-scene)>.story-scene{grid-column:1;grid-row:2/span 20;align-self:start;margin:0}
html.layout-landscape .sheet:has(>.story-scene) #storyCanvas{height:430px}
/* Ending: recap battle on the left, record card on the right; wider stats. */
html.layout-landscape #endingView .ed-scene{right:auto;width:62%;height:100%}
html.layout-landscape #endingView .ed-final .ed-scene{width:100%}
html.layout-landscape #endingView .ed-cardwrap{top:0;left:auto;width:38%;height:100%;padding:24px}
html.layout-landscape #endingView .ed-final .ed-cardwrap{background:linear-gradient(90deg,transparent,#060f15e6 35%)}
html.layout-landscape #endingView .ed-recap{background:linear-gradient(90deg,#060f15 40%,var(--land))}
html.layout-landscape #endingView .ed-stats{max-width:980px;margin:0 auto}
html.layout-landscape #endingView .ed-grid{grid-template-columns:repeat(4,1fr)}
html.layout-landscape #endingView .ed-epilogue{padding:40px 18%}
/* Mouse hover feedback (PC). */
html.has-keyboard button:not(:disabled):hover{filter:brightness(1.07)}
html.has-keyboard .choice:not(:disabled):hover,html.has-keyboard .action:not(:disabled):hover{border-color:#4f8d72}
/* Phones support portrait only: in landscape the game is covered by a rotate notice. */
#rotateNotice{display:none}
html.phone-landscape #rotateNotice{display:flex;position:fixed;inset:0;z-index:1000;background:#0a171e;color:#f6f2e7;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;font-family:var(--font-display,sans-serif)}
#rotateNotice .rotate-icon{font-size:46px;animation:rotateHint 2.2s ease-in-out infinite}
#rotateNotice b{font-size:20px;font-weight:400}#rotateNotice small{font-size:13px;color:#9fb4ac}
@keyframes rotateHint{0%,30%{transform:rotate(90deg)}60%,100%{transform:rotate(0)}}
/* Keyboard (PC): small key hints instead of touch hints; number keys on skills. */
/* Invisible owner-only tap area (settings, bottom). */
.dev-spot{display:block;width:100%;height:56px;margin-top:10px;padding:0;background:transparent;border:0;opacity:0;cursor:default}
.legend .kb-hint,.skill-key{display:none}
html.has-keyboard .legend .touch-hint{display:none}
html.has-keyboard .legend .kb-hint{display:inline;font-size:10px;opacity:.45;letter-spacing:0}
